name: Actualizar Feed RSS de Instagram

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerias necesarias
      run: |
        pip install feedgen

    - name: Ejecutar el script
      run: python generar_feed.py

    - name: Guardar y subir cambios a GitHub
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-actualizacion del feed RSS"
        file_pattern: 'instagram_feed.xml'
